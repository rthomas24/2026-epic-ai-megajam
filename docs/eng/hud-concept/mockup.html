<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flight HUD concept A</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060f; }
  .frame { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(ellipse 380px 200px at 300px 960px, rgba(120,230,255,.55), transparent 70%),
      radial-gradient(ellipse 300px 220px at 1720px 900px, rgba(255,120,220,.45), transparent 70%),
      radial-gradient(ellipse 620px 420px at 380px 300px, rgba(40,200,230,.42), transparent 70%),
      radial-gradient(ellipse 520px 380px at 520px 420px, rgba(150,60,220,.40), transparent 72%),
      radial-gradient(ellipse 700px 360px at 1500px 760px, rgba(220,60,190,.30), transparent 70%),
      radial-gradient(ellipse 500px 300px at 1350px 220px, rgba(255,150,60,.16), transparent 70%),
      radial-gradient(ellipse 900px 600px at 960px 540px, #120a2e, #05060f 80%);
    font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>

<div class="frame">

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <pattern id="stipple" width="7" height="7" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#C9D3E6" opacity=".45"/>
    <circle cx="5.5" cy="5" r=".7" fill="#C9D3E6" opacity=".3"/>
  </pattern>
  <pattern id="seg" width="14" height="20" patternUnits="userSpaceOnUse">
    <rect x="12" y="0" width="2" height="20" fill="#0A0F1C"/>
  </pattern>
  <radialGradient id="scopeFill" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#0E1830" stop-opacity=".78"/>
    <stop offset="1" stop-color="#070B16" stop-opacity=".86"/>
  </radialGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0E1424" stop-opacity=".82"/>
    <stop offset="1" stop-color="#070B16" stop-opacity=".88"/>
  </linearGradient>
  <clipPath id="scopeClip"><circle cx="1684" cy="886" r="140"/></clipPath>
  <style>
    .t { font-family: "Roboto","Segoe UI",Arial,sans-serif; fill: #E8EEF7; }
    .m { font-family: "Roboto Mono","Consolas","Cascadia Mono",monospace; fill: #E8EEF7; font-variant-numeric: tabular-nums; }
    .caps { letter-spacing: 1.5px; text-transform: uppercase; }
    .dim { fill: #8A94A6; }
    .rift { fill: #FF4FD8; } .lancer { fill: #2FE6FF; } .bastion { fill: #FFB13B; }
    .outline { paint-order: stroke; stroke: #05070E; stroke-width: 3px; stroke-linejoin: round; }
  </style>
</defs>
