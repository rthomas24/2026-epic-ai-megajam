; Triad Drift (engineering): a larger texture streaming pool. With the full art set (8K nebula sky, planet,
; ship, Dominion and planet-kit texture sets) the engine default of 1000 MB at Epic ran 300-1000 MB over budget
; (blurry textures, and "Video memory has been exhausted" on screen in non-Shipping builds). The pool is capped
; to the GPU's VRAM (70% by default on Windows), so small cards stay safe.
[TextureQuality@2]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1800

[TextureQuality@3]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=2600
