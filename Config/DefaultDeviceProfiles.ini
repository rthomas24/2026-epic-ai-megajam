; Texture groups left out of Oodle Texture RDO (docs/eng/BUILD-SIZE.md 6.8): smooth gradients are where RDO's 4x4
; block steps show. LossyCompressionAmount is a field of FTextureLODGroup (TextureLODSettings.h); a texture whose own
; Lossy Compression Amount is Default takes its group's (TextureDerivedData.cpp), and TLCA_None = RDO off for it.
; The other fields repeat the engine's values for these two groups (Engine/Config/BaseDeviceProfiles.ini), because an
; entry replaces the engine's entry for the same Group.
;   TEXTUREGROUP_Skybox: T_TD_NebulaSky, T_TD_Nebula_BC, T_TD_Stars_BC
;   TEXTUREGROUP_UI:     Nicholas's survey scans (T_Survey_*)
[GlobalDefaults DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_Skybox,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage,LossyCompressionAmount=TLCA_None)
+TextureLODGroups=(Group=TEXTUREGROUP_UI,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_NoMipmaps,LossyCompressionAmount=TLCA_None)
